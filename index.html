<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoFields - Public Lands Geospatial Analysis</title>
  
  <!-- Leaflet CSS for Web Mapping -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1a252f;
      color: #ffffff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }
    header p {
      margin: 0;
      font-size: 0.85rem;
      color: #bdc3c7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>GeoFields</h1>
      <p>Geospatial Analysis & Missing Persons SAR Probability Engine</p>
    </div>
    <div style="font-size: 0.8rem; text-align: right;">
      <span>Created by Ty Fields</span>
    </div>
  </header>

  <div id="map"></div>

  <!-- Leaflet JS for Web Mapping -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Link to GeoFields Core App Script -->
  <script src="src/app.js"></script>

</body>
</html>
